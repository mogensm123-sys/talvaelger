<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#132b46">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Talvælger</title>
<style>
:root{color-scheme:dark;--bg:#0c1725;--panel:#14263b;--accent:#42d6b0;--text:#f5f8fc;--muted:#a9bbcf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#203c59 0,#0c1725 65%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
main{width:min(100%,460px)}.brand{text-align:center;font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:800;margin-bottom:10px}
h1{text-align:center;font-size:clamp(30px,8vw,42px);margin:0 0 8px}.sub{text-align:center;color:var(--muted);margin:0 0 26px;font-size:15px}
.panel{background:rgba(20,38,59,.94);border:1px solid #2a435e;border-radius:24px;padding:22px;box-shadow:0 20px 55px #0004}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800;margin:3px 0 13px}
.balls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:23px}
.ball{display:flex;align-items:center;justify-content:center;width:53px;height:53px;border-radius:50%;font-weight:850;font-size:19px;background:linear-gradient(145deg,#fff,#dce9f4);color:#14263b;box-shadow:inset 0 -4px 0 #bacbd9,0 5px 12px #0003}
.bonus .ball{background:linear-gradient(145deg,#b5ffe8,#42d6b0);box-shadow:inset 0 -4px 0 #24a98a,0 5px 12px #0003}
hr{border:0;border-top:1px solid #2b4159;margin:0 0 21px}
button{width:100%;border:0;border-radius:15px;padding:16px 18px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .12s,filter .12s}
button:active{transform:scale(.98)}.primary{background:var(--accent);color:#09251f}.secondary{margin-top:10px;background:#243c56;color:var(--text);border:1px solid #3b5570}
.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:17px 8px 0}
.toast{text-align:center;height:20px;color:var(--accent);font-size:13px;margin-top:10px}
@media(max-width:360px){.ball{width:45px;height:45px;font-size:17px;gap:6px}.panel{padding:17px}}
</style>
</head>
<body>
<main>
<div class="brand">DIN PERSONLIGE TALVÆLGER</div>
<h1>🎲 Tilfældige tal</h1>
<p class="sub">5 tal fra 1–50 + 2 stjernetal fra 1–12</p>
<section class="panel" aria-live="polite">
<div class="section-title">Dine 5 hovedtal</div>
<div class="balls" id="mainNums"><span class="ball">—</span><span class="ball">—</span><span class="ball">—</span><span class="ball">—</span><span class="ball">—</span></div>
<hr>
<div class="section-title">Dine 2 ekstratal</div>
<div class="balls bonus" id="bonusNums"><span class="ball">—</span><span class="ball">—</span></div>
<button class="primary" id="generate">✨ Vælg nye tal</button>
<button class="secondary" id="copy">Kopiér mine tal</button>
<div class="toast" id="message"></div>
</section>
<p class="note">Tallene trækkes tilfældigt. Hvert tal vælges kun én gang i sin gruppe. Tallene giver ingen garanti for gevinst.</p>
</main>
<script>
const pick=(count,max)=>{const a=Array.from({length:max},(_,i)=>i+1);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,count).sort((x,y)=>x-y)};
let main=[],bonus=[];
function draw(){main=pick(5,50);bonus=pick(2,12);render('Nye tal er klar!')}
function render(msg=''){document.getElementById('mainNums').innerHTML=main.map(n=>`<span class="ball">${n}</span>`).join('');document.getElementById('bonusNums').innerHTML=bonus.map(n=>`<span class="ball">${n}</span>`).join('');document.getElementById('message').textContent=msg}
document.getElementById('generate').addEventListener('click',draw);
document.getElementById('copy').addEventListener('click',async()=>{if(!main.length){draw()}const text=`Hovedtal: ${main.join(', ')} | Ekstratal: ${bonus.join(', ')}`;try{await navigator.clipboard.writeText(text);document.getElementById('message').textContent='Tallene er kopieret!'}catch(e){document.getElementById('message').textContent=text}});
draw();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
